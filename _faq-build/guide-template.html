<!DOCTYPE html>
<html lang="{{HTML_LANG}}"{{DIR_ATTR}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{META_TITLE}}</title>
<meta name="description" content="{{META_DESC}}">
{{HEAD_LINKS}}
<style>
{{CSS_BASE}}

/* 도입부 */
.intro{padding:58px 0 34px}
.eyebrow{font-size:13.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--pink-deep);margin-bottom:15px}
h1{font-family:var(--serif);font-size:clamp(29px,5vw,44px);line-height:1.22;
  letter-spacing:-.01em;font-weight:600;text-wrap:balance;margin-bottom:17px}
.lead{font-size:16.5px;color:var(--ink-soft);max-width:62ch}
.lead strong{color:var(--ink);font-weight:600}

/* 본문 2단 — FAQ와 좌우가 반대다. 여기서는 화면이 주인공이고 설명이 따라간다. */
.cols{display:grid;grid-template-columns:373px minmax(0,1fr);gap:44px;
  align-items:start;padding-bottom:76px}
@media(max-width:920px){.cols{grid-template-columns:1fr;gap:30px}
  .sticky{position:static!important}}
.sticky{position:sticky;top:20px}
.stage{position:relative;width:373px;margin:0 auto}
@media(max-width:420px){.stage,.device{width:100%!important}}

/* 어느 폰을 보고 있는지 — 코드를 만드는 폰과 입력하는 폰이 다르다.
   이걸 말해 주지 않으면 한 사람이 혼자 다 하는 것처럼 보인다. */
.whose{display:flex;align-items:center;gap:8px;margin-bottom:11px;
  font-size:13px;font-weight:600;color:var(--ink-soft)}
.whose .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex:none}
.whose.family .dot{background:var(--pink-deep)}

/* 플랫폼 전환 (확인 창 단계에서만 의미가 있다) */
.pf{display:flex;gap:5px;margin-top:12px;visibility:hidden}
.pf.on{visibility:visible}
.pf-tab{font:inherit;font-size:12.5px;padding:5px 12px;border:1px solid var(--line);
  border-radius:999px;background:var(--paper);color:var(--ink-mute);cursor:pointer}
.pf-tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);
  border-color:var(--ink);font-weight:600}
.pf-tab:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* 재생 컨트롤 */
.ctrl{display:flex;align-items:center;gap:8px;margin-top:12px}
.ctrl button{font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);
  background:var(--paper);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ctrl button:hover:not(:disabled){border-color:var(--ink-mute);color:var(--ink)}
.ctrl button:disabled{opacity:.4;cursor:default}
.ctrl button svg{width:13px;height:13px;fill:currentColor}
.ctrl .count{margin-left:auto;font-size:12.5px;color:var(--ink-mute);
  font-variant-numeric:tabular-nums}
[dir="rtl"] .ctrl .count{margin-left:0;margin-right:auto}
.ctrl button:focus-visible,.step:focus-visible,.lang-switch a:focus-visible{
  outline:2px solid var(--teal);outline-offset:2px}

/* 단계 목록 — 애니메이션을 못 보거나 안 보는 사람에게는 이쪽이 본문이다.
   전 단계가 항상 글로 남아 있어 순서대로 읽을 수 있다. */
.steps{list-style:none;counter-reset:s}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:13px;
  padding:15px 14px;border-radius:12px;border:1px solid transparent;
  cursor:pointer;transition:background .18s ease,border-color .18s ease;
  width:100%;text-align:inherit;font:inherit;background:none;color:inherit}
.step+.step{margin-top:3px}
.step:hover{background:var(--paper)}
.step[aria-current="step"]{background:var(--paper);border-color:var(--line)}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--warm-paper);
  border:1px solid var(--line);color:var(--ink-mute);display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700}
.step[aria-current="step"] .n{background:var(--teal);border-color:var(--teal);color:#fff}
/* .h/.d는 span이라 block으로 바꿔야 줄이 나뉜다 — 인라인이면 제목과 설명이 붙는다 */
.step .h{display:block;font-size:15.5px;font-weight:600;line-height:1.5;margin-bottom:4px}
.step .d{display:block;font-size:14.5px;color:var(--ink-soft);line-height:1.6}
.step .d b{color:var(--ink);font-weight:600}

.note{margin-top:26px;padding:16px 18px;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;font-size:14px;
  color:var(--ink-soft);line-height:1.65}
.note strong{color:var(--ink);font-weight:600}
.caption{font-size:12.5px;color:var(--ink-mute);line-height:1.6;margin-top:13px}

{{CSS_MOCKUP}}
{{CSS_GUIDE_MOCKUP}}

/* 화면 전환 — 한 번에 하나만 보인다 */
.scr[hidden]{display:none}
/* 지금 눌러야 하는 곳. mockup.css의 .spot/.ring과 같은 언어를 쓴다. */
.tap{position:relative}
.tap::after{content:"";position:absolute;inset:-6px;border-radius:16px;
  border:2px solid #00685E;pointer-events:none;animation:pulse 2.4s ease-in-out infinite}
.tap.ind::after{border-color:#4355B9}
.tap.round::after{inset:-5px;border-radius:50%}
@media(prefers-reduced-motion:reduce){.tap::after{animation:none}
  .modal{animation:none}.fld .caret{animation:none}
  .connect,.fld,.hero .code{transition:none}}

{{CSS_FOOTER}}
</style>
</head>
<body>

<header class="site-head"><div class="wrap">
  <a class="site-logo" href="{{PATH}}">Anbu</a>
  {{SWITCHER}}
</div></header>

<div class="wrap">
  <div class="intro">
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1>{{TITLE}}</h1>
    <p class="lead">{{LEAD}}</p>
  </div>

  <div class="cols">
    <div class="sticky">
      <p class="whose" id="whose"><span class="dot"></span><span class="who-txt"></span></p>
      <div class="stage">
        <div class="device" id="device">

          <!-- ── 1) 보호자 설정 화면 ── -->
          <div class="scr" id="scr-settings">
            <div class="appbar tight">
              <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
              <span class="brand" data-key="settings_title"></span>
              <span class="grow"></span>
              <svg class="act" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-5.4-5.4c0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
            </div>
            <div class="screen">
              <div class="gap-lg"></div>

              <!-- G+S 버튼 (SolidActionButton tonal) — 애니메이션 1·2단계 대상 -->
              <div class="action a-tonal" id="gs-btn">
                <span class="badge"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg></span>
                <div class="txt"><div class="lbl" data-key="gs_enable_button"></div>
                  <div class="dsc" data-key="gs_enable_button_desc"></div></div>
              </div>
              <div class="gap-sp6"></div>

              <p class="sec-label" data-key="settings_subscription_service"></p>
              <div class="gap-md"></div>

              <div class="sub-card">
                <div class="sub-top">
                  <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19a2 2 0 0 0 2 2h16c1.1 0 2-.9 2-2V8c0-1.11-.9-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
                  <span data-key="settings_current_membership"></span>
                </div>
                <p class="sub-title" data-key="settings_free_trial"></p>
                <div class="sub-btn filled" data-key="subscription_subscribe"></div>
                <div class="sub-btn outline" data-key="subscription_restore"></div>
              </div>
              <div class="gap-lg"></div>

              <div class="row-card">
                <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                <span class="lbl" data-key="settings_notification"></span>
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
              </div>
              <div class="gap-sp6"></div>

              <div class="terms">
                <div class="head">
                  <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>
                  <span data-key="settings_terms_section"></span>
                </div>
                <div class="gap-lg"></div>
                <div class="lnk"><span data-key="settings_privacy_policy"></span>
                  <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg></div>
                <div class="gap-md"></div>
                <div class="lnk"><span data-key="settings_terms"></span>
                  <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg></div>
              </div>
            </div>
            <div class="bnav">{{BNAV_SETTINGS}}</div>
          </div>

          <!-- ── 2) 안전 홈 (코드 발급 후) ── -->
          <div class="scr" id="scr-safety" hidden>
            <div class="appbar">
              <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
              <span class="brand" data-key="app_name"></span>
            </div>
            <div class="screen">
              <p class="hdr" data-key="subject_home_share_title"></p>
              <div class="hero" id="hero">
                <div class="circ c1"></div><div class="circ c2"></div>
                <div class="top">
                  <span class="kicker">SAFETY SHARE CODE</span>
                  <span class="cbtn" id="btn-copy"><svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg></span>
                  <span class="cbtn" id="btn-share"><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81a3 3 0 1 0-3-3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9a3 3 0 1 0 0 6c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 1 0 2.92-2.92z"/></svg></span>
                </div>
                <div class="code" id="code">---  ----</div>
              </div>
              <div class="gap-lg"></div>

              <div class="state">
                <div class="bar"></div>
                <div class="in">
                  <span class="badge"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>
                  <div><div class="t" data-check-title></div><div class="b" data-check-body></div></div>
                </div>
              </div>
              <div class="gap-lg"></div>

              <div class="action a-tonal">
                <span class="badge"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg></span>
                <div class="txt"><div class="lbl" data-key="heartbeat_schedule_change"></div>
                  <div class="dsc" data-daily-time></div></div>
                <svg class="chev" viewBox="0 0 24 24" style="fill:#00685E"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
              </div>
              <div class="gap-lg"></div>

              <div class="action a-tonal">
                <span class="badge"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg></span>
                <div class="txt"><div class="lbl" data-key="subject_home_report_button"></div>
                  <div class="dsc" data-key="subject_home_report_desc"></div></div>
              </div>
              <div class="gap-lg"></div>

              <div class="action a-emg">
                <span class="badge"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>
                <div class="txt"><div class="lbl" data-key="subject_home_emergency_button"></div>
                  <div class="dsc" data-key="subject_home_emergency_desc"></div></div>
              </div>
            </div>
          </div>

          <!-- ── 3) 보호 대상자 연결 (가족의 폰) ── -->
          <div class="scr" id="scr-add" hidden>
            <div class="appbar tight">
              <svg class="back" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
              <span class="brand" data-key="add_subject_title"></span>
            </div>
            <div class="screen">
              <div class="gap-sp6"></div>
              <p class="add-h" data-key="add_subject_guide_title"></p>
              <div class="gap-sm"></div>
              <p class="add-sub" data-key="add_subject_guide_subtitle"></p>
              <div class="gap-sp6"></div>

              <p class="fld-label" data-key="add_subject_code_label"></p>
              <div class="gap-sm"></div>
              <div class="fld" id="fld-code"><span class="ph">123-4567</span></div>
              <div class="gap-sm"></div>
              <div class="fld-info">
                <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                <span data-key="add_subject_code_info"></span>
              </div>
              <div class="gap-sp6"></div>

              <p class="fld-label" data-key="add_subject_alias_label"></p>
              <div class="gap-sm"></div>
              <div class="fld" id="fld-alias"><span class="ph" data-key="add_subject_alias_hint"></span></div>
              <div class="gap-sp6"></div>

              <p class="fld-label" data-key="add_subject_phone_label"></p>
              <div class="gap-sm"></div>
              <div class="fld" id="fld-phone"><span class="ph" data-key="add_subject_phone_hint"></span></div>
              <div class="gap-sm"></div>
              <div class="fld-info">
                <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                <span data-key="add_subject_phone_info"></span>
              </div>
              <div class="gap-sp6"></div>

              <div class="connect" id="connect">
                <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4a5 5 0 0 0 0-10z"/></svg>
                <span data-key="add_subject_connect"></span>
              </div>
            </div>
            <div class="bnav">{{BNAV_CONNECT}}</div>
          </div>

        </div>

        <!-- 안전 코드 생성 확인 다이얼로그. iOS는 주황 경고 카드가 더 붙고 확인
             버튼 문구도 다르다 (_showEnableConfirm / _showEnableConfirmIOS).
             iOS에서는 이 기능이 대상자 기능의 유일한 경로라 경고를 생략할 수 없다. -->
        <div class="modal" id="modal" hidden>
          <div class="dlg" data-pf="and">
            <p class="dlg-title" data-key="gs_enable_dialog_title"></p>
            <div class="dlg-body"><p data-key="gs_enable_dialog_body"></p></div>
            <div class="dlg-actions">
              <button class="dlg-btn" type="button" tabindex="-1" disabled
                style="color:#3F4948" data-key="common_cancel"></button>
              <button class="dlg-btn" type="button" tabindex="-1" disabled
                style="color:#4355B9;font-weight:700" data-key="gs_enable_confirm"></button>
            </div>
          </div>
          <div class="dlg" data-pf="ios" hidden>
            <p class="dlg-title" data-key="gs_enable_dialog_title"></p>
            <div class="dlg-body"><p data-key="gs_enable_dialog_body"></p></div>
            <div class="ios-warn">
              <p class="t" data-key="gs_enable_dialog_ios_warning_title"></p>
              <p class="b" data-key="gs_enable_dialog_ios_warning_body"></p>
            </div>
            <div class="dlg-actions">
              <button class="dlg-btn" type="button" tabindex="-1" disabled
                style="color:#3F4948" data-key="common_cancel"></button>
              <button class="dlg-btn" type="button" tabindex="-1" disabled
                style="color:#E65100;font-weight:700" data-key="gs_enable_dialog_ios_confirm"></button>
            </div>
          </div>
        </div>

        <!-- 코드 복사 스낵바 -->
        <div class="snack" id="snack" hidden data-key="subject_home_code_copied"></div>
      </div>

      <!-- 확인 창이 플랫폼별로 다른 단계에서만 쓰인다. 자리는 늘 잡아 둬(visibility)
           단계를 넘길 때 아래 컨트롤이 튀지 않게 한다. -->
      <div class="pf" id="pf">
        <button class="pf-tab" type="button" data-pf="and" aria-pressed="true">Android</button>
        <button class="pf-tab" type="button" data-pf="ios" aria-pressed="false">iPhone</button>
      </div>

      <div class="ctrl">
        <button type="button" id="prev">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          <span>{{CTRL_PREV}}</span></button>
        <button type="button" id="next">
          <span>{{CTRL_NEXT}}</span>
          <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
        <button type="button" id="replay">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
          <span>{{CTRL_REPLAY}}</span></button>
        <span class="count" id="count"></span>
      </div>
      <p class="caption">{{MOCKUP_CAPTION}}</p>
    </div>

    <main>
      <ol class="steps" id="steps">{{STEPS}}</ol>
      {{NOTE}}
    </main>
  </div>
</div>

<footer><div class="wrap">
  <a href="{{PATH}}">{{FOOTER_HOME}}</a>
  <a href="{{PATH}}faq.html">{{FOOTER_FAQ}}</a>
  <a href="{{PATH}}privacy-policy.html">{{FOOTER_PRIVACY}}</a>
  <a href="{{PATH}}terms-of-service.html">{{FOOTER_TERMS}}</a>
  <span class="copy">{{FOOTER_COPYRIGHT}}</span>
</div></footer>

<script>
// 앱 번역 파일에서 추출한 실제 문구 (extract_strings.py)
var S = {{APP_STRINGS}};
var WHO = {{WHO}};          // 어느 폰인지 라벨 2개
var DEMO = {{DEMO}};        // 목업에 채워 넣는 예시값 (코드·별칭·연락처)

document.querySelectorAll('[data-key]').forEach(function(el){
  el.textContent = S[el.dataset.key] || '';
});
// @time 자리표시자는 템플릿이 채운다 (extract_strings.py의 PLACEHOLDER_OK)
// 날짜는 **오늘**이어야 한다 — 이 화면은 안전 코드를 방금 만든 직후에 나오고,
// enableSubjectFeature()가 그때 첫 안부를 바로 보내므로 어제 날짜면 사실과 다르다.
// 고정값으로 박으면 시간이 지나 저절로 틀려지기도 한다.
(function(){
  var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
  var today = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  document.querySelector('[data-check-title]').textContent =
    S.subject_home_check_title_last + ' : ' + today;
})();
document.querySelector('[data-check-body]').textContent =
  S.subject_home_check_body_reported.replace('@time','18:00');
document.querySelector('[data-daily-time]').textContent =
  S.heartbeat_daily_time.replace('@time','18:00');

var $ = function(id){ return document.getElementById(id); };
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

// 각 단계가 무엇을 보여주는지. render()가 이 표만 보고 화면 전체를 다시 그린다
// — 단계를 누적 변경하지 않으므로 이전/다음/건너뛰기가 전부 같은 경로를 탄다.
var STEPS = [
  {scr:'settings', tap:'gs-btn',  who:0},
  {scr:'settings', tap:'gs-btn',  who:0, dialog:true},
  {scr:'safety',   tap:null,      who:0, code:true},
  {scr:'safety',   tap:'btn-copy', who:0, code:true, round:true, snack:true},
  {scr:'add',      tap:null,      who:1},
  {scr:'add',      tap:'fld-code',  who:1, fill:1},
  {scr:'add',      tap:'fld-alias', who:1, fill:2},
  {scr:'add',      tap:'fld-phone', who:1, fill:3},
  {scr:'add',      tap:'connect',   who:1, fill:3, ready:true, ind:true}
];

var FILLS = [
  {el:'fld-code',  val:function(){ return DEMO.code; }},
  {el:'fld-alias', val:function(){ return DEMO.alias; }},
  {el:'fld-phone', val:function(){ return DEMO.phone; }}
];

var idx = 0, timer = null, typer = null, playing = !reduce.matches, platform = 'and';
var stepBtns = Array.prototype.slice.call(document.querySelectorAll('.step'));

function setField(i, text, caret){
  var el = $(FILLS[i].el);
  el.innerHTML = '';
  if (text === null) {
    var ph = document.createElement('span');
    ph.className = 'ph';
    ph.textContent = FILLS[i].el === 'fld-code' ? '123-4567'
      : (FILLS[i].el === 'fld-alias' ? S.add_subject_alias_hint : S.add_subject_phone_hint);
    el.append(ph);
  } else {
    el.append(document.createTextNode(text));
    if (caret) { var c = document.createElement('i'); c.className = 'caret'; el.append(c); }
  }
}

function render(i){
  if (typer) { clearInterval(typer); typer = null; }
  var s = STEPS[i];

  ['settings','safety','add'].forEach(function(n){
    $('scr-' + n).hidden = (n !== s.scr);
  });

  $('whose').className = 'whose' + (s.who ? ' family' : '');
  $('whose').querySelector('.who-txt').textContent = WHO[s.who];

  $('modal').hidden = !s.dialog;
  $('pf').classList.toggle('on', !!s.dialog);
  document.querySelectorAll('.modal .dlg').forEach(function(d){
    d.hidden = d.dataset.pf !== platform;
  });
  $('snack').hidden = !s.snack;
  $('code').textContent = s.code ? DEMO.code : '---  ----';
  $('code').style.color = s.code ? '#fff' : 'rgba(255,255,255,.35)';
  $('connect').classList.toggle('ready', !!s.ready);

  var fill = s.fill || 0;
  for (var f = 0; f < FILLS.length; f++) {
    setField(f, f < fill ? FILLS[f].val() : null, false);
  }
  // 이번 단계에서 채워지는 칸만 한 글자씩 — 앱에서 직접 입력하는 부분이다
  if (fill > 0 && s.tap === FILLS[fill - 1].el) {
    var target = FILLS[fill - 1].val();
    if (reduce.matches) { setField(fill - 1, target, false); }
    else {
      var n = 0;
      setField(fill - 1, '', true);
      typer = setInterval(function(){
        n++;
        setField(fill - 1, target.slice(0, n), n < target.length);
        if (n >= target.length) { clearInterval(typer); typer = null; }
      }, 110);
    }
  }

  document.querySelectorAll('.tap').forEach(function(el){
    el.classList.remove('tap','round','ind');
  });
  if (s.tap) {
    var t = $(s.tap);
    t.classList.add('tap');
    if (s.round) t.classList.add('round');
    if (s.ind) t.classList.add('ind');
  }
  document.querySelectorAll('.fld').forEach(function(el){ el.classList.remove('on'); });
  if (s.tap && s.tap.indexOf('fld-') === 0) $(s.tap).classList.add('on');

  stepBtns.forEach(function(b, n){
    if (n === i) b.setAttribute('aria-current', 'step');
    else b.removeAttribute('aria-current');
  });
  $('count').textContent = (i + 1) + ' / ' + STEPS.length;
  $('prev').disabled = (i === 0);
  $('next').disabled = (i === STEPS.length - 1);
}

function go(i, manual){
  idx = Math.max(0, Math.min(STEPS.length - 1, i));
  if (manual) stop();
  render(idx);
  if (playing) schedule();
}

function schedule(){
  clearTimeout(timer);
  if (idx >= STEPS.length - 1) { playing = false; return; }
  // 입력 단계는 타이핑이 끝날 시간을 준다
  var s = STEPS[idx];
  var ms = (s.fill && s.tap && s.tap.indexOf('fld-') === 0) ? 3400 : 2600;
  timer = setTimeout(function(){ go(idx + 1, false); }, ms);
}

function stop(){ playing = false; clearTimeout(timer); }

$('pf').addEventListener('click', function(e){
  var t = e.target.closest('.pf-tab');
  if (!t) return;
  platform = t.dataset.pf;
  $('pf').querySelectorAll('.pf-tab').forEach(function(x){
    x.setAttribute('aria-pressed', String(x === t));
  });
  stop();          // 창을 비교해 보는 중이니 자동으로 넘어가지 않는다
  render(idx);
});

$('prev').addEventListener('click', function(){ go(idx - 1, true); });
$('next').addEventListener('click', function(){ go(idx + 1, true); });
$('replay').addEventListener('click', function(){
  playing = !reduce.matches;
  go(0, false);
});
stepBtns.forEach(function(b, n){
  b.addEventListener('click', function(){
    go(n, true);
    if (window.matchMedia('(max-width:920px)').matches) {
      document.querySelector('.stage').scrollIntoView(
        {behavior: reduce.matches ? 'auto' : 'smooth', block: 'center'});
    }
  });
});

// 화면 밖에서 혼자 돌지 않도록 — 보이지 않으면 멈춘다
if ('IntersectionObserver' in window) {
  new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (!e.isIntersecting) { clearTimeout(timer); }
      else if (playing) { schedule(); }
    });
  }, {threshold: 0.25}).observe(document.querySelector('.stage'));
}

go(0, false);
</script>
</body>
</html>
