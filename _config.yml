# GitHub Pages(Jekyll) 설정 — averic.co.kr
#
# 이 파일의 유일한 목적은 **내부 문서를 웹 게시에서 제외**하는 것이다.
# Jekyll은 front matter가 없는 .md도 정적 파일로 그대로 복사하므로,
# 제외하지 않으면 averic.co.kr/CLAUDE.md 로 내부 문서가 공개된다.
#
# `_` 로 시작하는 폴더(_beta-test-build/, _faq-build/)는 Jekyll이
# 기본적으로 제외하므로 여기에 적지 않아도 게시되지 않는다.
#
# ⚠️ exclude 를 지정하면 Jekyll 기본 제외 목록을 **대체**한다.
#    아래에 기본값을 함께 적어 둔 이유다 — 항목을 지우지 말 것.

exclude:
  # 내부 문서 (이 파일의 존재 이유)
  - CLAUDE.md
  # 빌드 도구 — `_` 로 시작하지 않아 Jekyll 기본 제외에 안 걸린다.
  # 빼기 전에는 averic.co.kr/i18n/build.py 와 translations.json 이 200 으로
  # 공개돼 있었다(2026-08-07 확인). 산출물은 {lang}/index.html 이므로
  # 제외해도 사이트 동작에 영향이 없다.
  - i18n/
  # ── 아래는 Jekyll 기본 제외 목록 (exclude 지정 시 사라지므로 재명시) ──
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
