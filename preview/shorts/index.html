<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>숏폼 시험 영상 · Averic Lab</title>
<style>
  :root { --bg:#0a0e2a; --tx:#e9ecf6; --tx2:#a8b0cc; --bd:rgba(255,255,255,.10); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.6; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .note { color: var(--tx2); font-size: 14px; margin: 0 0 24px; word-break: keep-all; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px; }
  figure { margin: 0; }
  video { display: block; width: 100%; max-width: 360px; aspect-ratio: 9 / 16; margin: 0 auto;
    border-radius: 18px; background: #000; border: 1px solid var(--bd); }
  figcaption { max-width: 360px; margin: 12px auto 0; font-size: 14px; color: var(--tx2); word-break: keep-all; }
  figcaption b { display: block; color: var(--tx); font-size: 16px; }
  figcaption a { color: #8b9cf0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>숏폼 시험 영상 (검토용)</h1>
  <p class="note">검색에 노출되지 않는 내부 검토 페이지입니다. 영상에는 소리가 없습니다 — 배경음악은 업로드할 때 각 플랫폼에서 붙입니다.</p>
  <div class="grid">
    <figure>
      <video src="a.mp4" poster="a.jpg" controls playsinline muted loop preload="metadata"></video>
      <figcaption><b>A. 전화 안 받는 엄마</b>22초 · 폰 한 대로 장면이 이어지는 구성 · <a href="a.mp4" download>내려받기</a></figcaption>
    </figure>
    <figure>
      <video src="b.mp4" poster="b.jpg" controls playsinline muted loop preload="metadata"></video>
      <figcaption><b>B. 유학 간 딸</b>23초 · 서울·보스턴 위아래 분할 구성 · <a href="b.mp4" download>내려받기</a></figcaption>
    </figure>
  </div>
</div>
</body>
</html>
