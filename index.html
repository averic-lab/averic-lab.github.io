<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff8a95'/%3E%3Cstop offset='1' stop-color='%23e54b5e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M50,86 C-10,52 12,8 50,32 C88,8 110,52 50,86 Z'/%3E%3C/svg%3E">

<script>
/* Locale router — picks the best available locale and redirects.
   Order of precedence:
     1. URL ?lang=xx      (선택을 저장까지 한다 — 교정 링크로 쓸 수 있게)
     2. 저장된 선택 (90일 만료)
     3. navigator.languages / navigator.language
     4. fallback to /en/

   ⚠️ 저장된 선택은 기기 언어를 덮어쓴다. 예전에는 만료도 없고 되돌릴 UI도 없어서,
   스위처에서 언어를 한 번 누르면 그 브라우저에서는 **영원히** 그 언어로 열렸다
   (한국어 폰인데 일본어로 뜨는 현상). 그래서 셋을 고쳤다:
     · ?lang= 이 저장값도 갱신 → averic.co.kr/?lang=ko 링크 하나로 영구 교정
     · 90일 만료
     · 예전 형식(코드 문자열만, 시각 없음)은 읽는 즉시 폐기 → 이미 갇힌 사용자도 자동 복구
   Update SUPPORTED as new locale folders ship. */
(function () {
  var SUPPORTED = ['en','ko','ja','zh-CN','zh-TW','de','fr','es','it','pt-BR','ru','nl','pl','tr','vi','th','id','sv','hi','ar'];
  var FALLBACK  = 'en';

  function matchLang(raw) {
    if (!raw) return null;
    var code = String(raw).toLowerCase();

    // exact (case-insensitive)
    for (var i = 0; i < SUPPORTED.length; i++) {
      if (SUPPORTED[i].toLowerCase() === code) return SUPPORTED[i];
    }
    // Chinese variants
    if (code === 'zh' || code.indexOf('zh-cn') === 0 || code.indexOf('zh-hans') === 0 || code.indexOf('zh-sg') === 0) {
      if (SUPPORTED.indexOf('zh-CN') !== -1) return 'zh-CN';
    }
    if (code.indexOf('zh-tw') === 0 || code.indexOf('zh-hk') === 0 || code.indexOf('zh-hant') === 0 || code.indexOf('zh-mo') === 0) {
      if (SUPPORTED.indexOf('zh-TW') !== -1) return 'zh-TW';
    }
    // Portuguese — always map to pt-BR if supported
    if (code.indexOf('pt') === 0 && SUPPORTED.indexOf('pt-BR') !== -1) return 'pt-BR';

    // primary tag match (en-US → en, ja-JP → ja, etc.)
    var base = code.split('-')[0];
    for (var j = 0; j < SUPPORTED.length; j++) {
      var supBase = SUPPORTED[j].toLowerCase().split('-')[0];
      if (supBase === base) return SUPPORTED[j];
    }
    return null;
  }

  var STORE_KEY  = 'anbu.lang';
  var MAX_AGE_MS = 90 * 24 * 60 * 60 * 1000;   // 90일

  function saveChoice(code) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ code: code, t: Date.now() }));
    } catch (e) {}
  }

  function readSaved() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      // 예전 형식은 코드 문자열만이라 만료 시각이 없다 → 영구 고착의 원인이었다. 폐기한다.
      if (raw.charAt(0) !== '{') { localStorage.removeItem(STORE_KEY); return null; }
      var o = JSON.parse(raw);
      if (!o || !o.code || !o.t || (Date.now() - o.t) > MAX_AGE_MS) {
        localStorage.removeItem(STORE_KEY);
        return null;
      }
      return matchLang(o.code);
    } catch (e) { return null; }
  }

  function pick() {
    // 1. URL override — 저장까지 갱신해야 다음 방문에도 유지된다
    var m = location.search.match(/[?&]lang=([\w-]+)/);
    if (m && m[1]) {
      var fromUrl = matchLang(m[1]);
      if (fromUrl) { saveChoice(fromUrl); return fromUrl; }
    }
    // 2. user's saved choice (90일 만료)
    var fromStore = readSaved();
    if (fromStore) return fromStore;
    // 3. browser languages, in the user's own order of preference.
    //    With 20 locales shipped we honor the full ordered list: the first
    //    entry that maps to a supported locale wins; anything unmapped falls
    //    through to English.
    var langs = (navigator.languages && navigator.languages.length)
                  ? navigator.languages
                  : [navigator.language || navigator.userLanguage || ''];
    for (var k = 0; k < langs.length; k++) {
      var hit = matchLang(langs[k]);
      if (hit) return hit;
    }

    return FALLBACK;
  }

  var target = '/' + pick() + '/';
  // Preserve any incoming hash (e.g. /#contact) so deep-links survive the redirect.
  if (location.hash) target += location.hash;
  location.replace(target);
})();
</script>

<style>
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(ellipse at 70% 0%, #1f1d52 0%, transparent 55%),
      radial-gradient(ellipse at 10% 100%, #2a1f55 0%, transparent 60%),
      linear-gradient(180deg, #0a0e2a 0%, #161a47 60%, #2a2360 100%);
    color: #fff8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center;

  }
  .splash { padding: 24px; }
  .splash .mark {
    width: 44px; height: 44px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #ff8a95, #e54b5e);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(229, 75, 94, 0.4);
    display: flex; align-items: center; justify-content: center;
    animation: pulse 2s ease-in-out infinite;
  }
  .splash .mark svg { width: 22px; height: 22px; }
  @keyframes pulse {
    0%, 100% { transform: scale(1);    opacity: 0.95; }
    50%      { transform: scale(1.06); opacity: 1; }
  }
  .splash .name {
    font-size: 14px; letter-spacing: 4px;
    color: #ffd9a8; opacity: 0.8;
    text-transform: uppercase;
  }
  .splash .hint {
    margin-top: 18px;
    font-size: 12px;
    color: rgba(255, 248, 240, 0.45);
    letter-spacing: 0.5px;
  }
  .splash .links { margin-top: 28px; font-size: 13px; }
  .splash .links a {
    color: #ffd9a8;
    text-decoration: none;
    margin: 0 10px;
    border-bottom: 1px solid rgba(255, 217, 168, 0.3);
    padding-bottom: 2px;
  }
  .splash .links a:hover { border-bottom-color: rgba(255, 217, 168, 0.8); }
</style>

</div>
