<div class="v">

<script src="engine.js"></script>
<script>
  // ── 박 그리드 ────────────────────────────────────────────────────────
  const BPM = 124, B = 60 / BPM, BAR = 4 * B;            // 1박 0.4839초 · 1마디 1.9355초 (실측 123.97~124.02)
  // 곡 도입부 박 0–8(약 3.9초)은 거의 무음이라(-49~-41dB, 본편보다 20dB 이상 작다) 잘라낸다 — 영상 0초 = 타임라인 박 8.
  //   박 번호는 곡 박자 그대로라 아래 시간표는 손대지 않는다. 음악도 shorts.json bgm_start 를 같은 만큼(8박) 뒤로 민다.
  const T0 = 8 * B;
  const VLEAD = .05;                                     // 화면을 소리보다 50ms 먼저(아래 window.extra 설명)
  // ⚠️ engine.js 의 data-t 요소(공통 엔딩)는 window.extra 를 거치지 않고 '영상 시각'으로 움직인다 — 타임라인 박을 VT 로 바꿔 넣을 것.
  //   T0 를 넣고 이걸 빠뜨려 엔딩이 3.9초 늦게 떠 빈 화면이 생기고 로고는 영상 끝(90초) 뒤로 밀렸다(2026-10-10).
  const VT = b => b * B - T0 - VLEAD;
  window.DURATION = 194 * B - T0;                             // 마지막 타격(박 188, 90.97초) 뒤 로고를 6박 더 보여 준다 = 93.9초
  window.CRF = 28;                                       // 플랩·컨페티가 많아 저장소 사본은 28(유튜브 원본은 CRF=18 로 따로)
  window.SFX = [];                                       // 효과음 없음 — 모든 소리는 음악 박자로만

  const LANG = (L.bcp || 'ko').slice(0, 2).toLowerCase();
  const C = { cream: '#fff8f0', navy: '#10163f', amber: '#ffc23d', gold: '#ffd166', coral: '#ff7a8f', red: '#ff3b4e',
              teal: '#14b8a6', mint: '#5eead4', indigo: '#5b6cff', sky: '#8ea0ff' };
  const stage = document.querySelector('.stg');
  const clamp = (x, a = 0, b = 1) => Math.min(Math.max(x, a), b);
  const ease3 = q => 1 - Math.pow(1 - q, 3);

    for (let i = 0; i < 120; i++) { const a = hf(i, 11) * 6.283, sp = .5 + hf(i, 12) * 1.2, ph = (hf(i, 13) + t * sp * 1.3) % 1;
      const r0 = 20 + ph * ph * 720, r1 = r0 + (30 + ph * 280) * I;
      fx.globalAlpha = clamp(ph * I * .9); fx.strokeStyle = i % 5 ? '#ffffff' : C.gold; fx.lineWidth = 1 + ph * 2.5;
      fx.beginPath(); fx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); fx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); fx.stroke(); }
    fx.globalAlpha = 1; }
  function mapGrid(t, a) {   // 낯선 골목 — 고정된 거리선(프레임마다 같은 모양)
    fx.globalAlpha = a * .32; fx.strokeStyle = '#8ea0ff'; fx.lineWidth = 2;
    for (let i = 0; i < 9; i++) { const y = 300 + i * 28 + hf(i, 21) * 10; fx.beginPath(); fx.moveTo(65, y); fx.lineTo(475, y + (hf(i, 22) - .5) * 40); fx.stroke(); }
    for (let i = 0; i < 8; i++) { const x = 72 + i * 54 + hf(i, 23) * 16; fx.beginPath(); fx.moveTo(x, 290); fx.lineTo(x + (hf(i, 24) - .5) * 50, 518); fx.stroke(); }
    fx.globalAlpha = a * .12; fx.fillStyle = '#8ea0ff';
    for (let i = 0; i < 14; i++) fx.fillRect(70 + hf(i, 25) * 360, 300 + hf(i, 26) * 200, 20 + hf(i, 27) * 40, 14 + hf(i, 28) * 20);
    fx.globalAlpha = 1; }
  function pulseQ(t, t0, t1, P0, P1, P2, col) { const q = clamp((t - t0) / (t1 - t0)); if (q <= 0 || q >= 1) return;
    for (let j = 0; j < 12; j++) { const s = q - j * .022; if (s < 0) continue; const u = 1 - s;
      const x = u * u * P0[0] + 2 * u * s * P1[0] + s * s * P2[0], y = u * u * P0[1] + 2 * u * s * P1[1] + s * s * P2[1];
      fx.globalAlpha = 1 - j / 12; fx.fillStyle = col; fx.beginPath(); fx.arc(x, y, 7 * (1 - j / 14), 0, 6.283); fx.fill(); }
    fx.globalAlpha = 1; }
  function beam(t) { const a = clamp((t - 159.5 * B) / .2) * clamp((162.5 * B - t) / .3);
    fx.globalAlpha = a; fx.strokeStyle = '#ff5f7a'; fx.lineWidth = 3; fx.setLineDash([12, 10]); fx.lineDashOffset = -t * 90;
    fx.beginPath(); fx.moveTo(PINX, PINY); fx.quadraticCurveTo(430, 440, 300, 640); fx.stroke(); fx.setLineDash([]); fx.globalAlpha = 1; }
  function drawFX(t) {
    fx.setTransform(2, 0, 0, 2, 0, 0); fx.clearRect(0, 0, 540, 960);
    const bt = t / B;
    const sa = bt < 16.3 ? 1 : (bt > 40 && bt < 52.3) ? .9 : (bt > 109.8 && bt < 116.5) ? clamp((116.5 - bt) / .6) : (bt > 154 && bt < 166.3) ? .6 : 0;
    if (sa) stars(t, sa);
    if (bt < 16.35) runway(t, clamp((16.35 - bt) / .35));
    if (bt > 109.8 && bt < 116.4) globe(t);
    if (bt > 65.4 && bt < 68.6) warp(t, clamp((bt - 65.4) / 1.6) * clamp((68.6 - bt) / .5));
    if (bt > 113.8 && bt < 116.8) warp(t, clamp((bt - 113.8) / 1.4) * clamp((116.8 - bt) / .6));
    if (bt > 154.1 && bt < 166.3) mapGrid(t, clamp((bt - 154.1) / .6) * clamp((166.3 - bt) / .3));
    if (bt > 159.3 && bt < 162.6) beam(t);
    pulseQ(t, 135 * B, 136 * B, [CX, 584], [470, 540], [520, 690], C.gold);
    pulseQ(t, 168.6 * B, 169.9 * B, [160, 458], [CX, 360], [380, 508], C.gold);
    pulseQ(t, 168.9 * B, 170.2 * B, [380, 558], [CX, 700], [160, 508], C.mint);
  }
  // 앞 캔버스 — 연결되는 순간 두 폰 사이의 전기 아크
  function zap(ctx, t) { const I = clamp((t - 108 * B) / .05) * clamp((109.7 * B - t) / .4); if (I <= 0) return;
    const seed = Math.floor(t * 24), x1 = 160, x2 = 380, y = 506;
    [[10, `rgba(142,160,255,${(.55 * I).toFixed(3)})`], [2.6, `rgba(255,255,255,${I.toFixed(3)})`]].forEach(([w, c], pass) => {
      ctx.beginPath(); for (let i = 0; i <= 18; i++) { const s = i / 18, off = (hf(i + pass * 37, seed) - .5) * 52 * Math.sin(Math.PI * s); ctx.lineTo(x1 + (x2 - x1) * s, y + off); }
      ctx.lineWidth = w; ctx.strokeStyle = c; ctx.lineJoin = 'round'; ctx.stroke(); }); }

  // ── 글리치(박 55.5–57) — RGB 어긋남 + 잘린 띠 + 스캔라인. 화면 전체 빨간 깜빡임은 쓰지 않는다 ──
  const GL = [55.5, 55.9, 56.2, 56.45, 56.7, 56.9];
  const glitchAt = t => GL.reduce((m, b) => { const d = t - b * B; return d >= 0 && d < .09 ? 1 : m; }, 0);

  const FLASH = [[16, .3], [60, .85], [68, .3], [108, .55], [116, .35], [122.5, .25], [188, .45]];   // 초당 3회 미만(광과민성)
  const flashEl = document.querySelector('.flash'), scanEl = document.querySelector('.scan'), bgA = document.getElementById('bgA'), bgB = document.getElementById('bgB');
  const cb = document.getElementById('cb').getContext('2d'), cf = document.getElementById('cf').getContext('2d');

  // ── 글자 맞춤 — 상자마다 자기 폭을 기준으로 줄인다(독일어·러시아어 등 긴 언어) ──
  const tw = e => { const w0 = e.style.width; e.style.width = 'max-content'; const w = e.offsetWidth; e.style.width = w0; return w; };
  const fitTo = (e, limit, m = tw) => { let s = parseFloat(getComputedStyle(e).fontSize), g = 0; while (m(e) > limit && s > 10 && g++ < 80) { s -= 1; e.style.fontSize = s + 'px'; } };
  const scrollW = e => e.scrollWidth;
  const pushFix = [];                                    // 알림 카드 — 아래 안전 영역(762)을 넘으면 위로 올린다
  REG.forEach(r => { if (r.el.classList.contains('push')) pushFix.push(r); });
  // 헤드라인 블록: ① 줄마다 한 줄 유지하며 기본 크기의 80%까지 줄인다 ② 그래도 넘치는 줄만 그 줄 안에서 균형 있게 줄바꿈
  //   ③ 블록이 구역보다 높으면 더 줄인다 ④ 구역 안 세로 가운데에 놓는다
  function fitHead(el) {
    const [z0, z1] = el._zone, zh = z1 - z0, W = 400, segs = [...el.querySelectorAll('.seg')];
    let s = el._base; el.style.fontSize = s + 'px'; segs.forEach(g => g.classList.remove('wr'));
    const min1 = Math.round(el._base * .8);
    while (s > min1 && segs.some(g => tw(g) > W)) { s -= 1; el.style.fontSize = s + 'px'; }
    segs.forEach(g => { if (tw(g) > W) g.classList.add('wr'); });
    while (s > 20 && el.offsetHeight > zh) { s -= 1; el.style.fontSize = s + 'px'; }
    el.style.top = (z0 + (zh - el.offsetHeight) / 2).toFixed(1) + 'px';
  }
  function FIT() {
    document.querySelectorAll('.t.hb').forEach(fitHead);
    document.querySelectorAll('.t:not(.hb)').forEach(e => fitTo(e, Math.min(e.clientWidth, 400)));
    document.querySelectorAll('.tag, .okchip, .wp, .pill2, .glab, .sos2 span, .lgd, .roll').forEach(e => fitTo(e, 400, scrollW));
    document.querySelectorAll('.wpw .wp').forEach(e => fitTo(e, 250, scrollW));
    // 블록·라벨 글자는 상자 폭이 아니라 글자 자체의 폭(max-content)으로 잰다 — block 요소의 scrollWidth 는 늘 상자 폭이라 끝없이 줄어든다
    document.querySelectorAll('.blk span, .cblk span').forEach(e => fitTo(e, e.parentNode.clientWidth - 40));
    document.querySelectorAll('.dlab b, .dlab span, .nxt, .mct, .calh, .frm .flb, .frm .cbtn').forEach(e => fitTo(e, (e.parentNode.clientWidth || 180) - 12));
    pushFix.forEach(r => { const el = r.el, s = r.o.s0 || 1, h = el.offsetHeight, top = parseFloat(el.style.top);
      const vb = top + .55 * h + .45 * h * s; if (vb > 762) el.style.top = (top - (vb - 762)).toFixed(1) + 'px'; });
  }
  function measureFly() {   // 날아가는 코드 칸: 왼쪽 폰의 플랩 칸 → 오른쪽 폰 입력 칸(글자 폭만큼씩)
    const typ = phR.querySelector('.inp'), ir = typ.getBoundingClientRect(), cw = 13;
    FLYPOS = codeRow._tiles.map((T, i) => { const r = T.d.getBoundingClientRect(); return [r.left, r.top, ir.left + 10 + i * cw, ir.top + 4]; });
  }

  window.__hits = () => ({
    reg: REG.map(r => [r.beat, r.kind, (r.el.className + ' ' + (r.el.textContent || '').trim()).slice(0, 40)]),
    exit: REG.map(r => [r.z / B, (r.el.className + ' ' + (r.el.textContent || '').trim()).slice(0, 40)]),
    burst: BURSTS.map(b => [b.t0 / B]), shake: SHAKE.map(s => [s.t / B]),
    sts: STS.map(S => [S.a / B, S.f == null ? null : S.f / B]),
    flap: FL.map(T => T.plan.map(p => p.s / B)) });
  fillText();
  REG.forEach(r => { if (r.kind === 'kin') splitUnits(r.el); });
  POOL = [...POOLSET];
  FIT(); measureFly();
  document.fonts.ready.then(() => { FIT(); measureFly(); });

  // 화면을 소리보다 50ms 먼저 그린다(2026-10-10 실측). 장면 전환의 배경 원 번짐·큰 미끄러짐은 변화가 가장 큰 순간이
  //   시작 후 2~3프레임 뒤라, 박에 맞춰 시작해도 화면이 소리보다 늦게 느껴진다(늦음은 45ms 부터 보인다).
  //   먼저 그리는 쪽은 125ms 까지 어색하지 않다 — 빛이 소리보다 먼저 오는 것과 같다. 50ms 에서 큰 변화의 늦음이 21건 → 5건.
  window.extra = tv => {
    const t = tv + T0 + VLEAD;
    const i = sceneAt(t), t0 = SCENES[i][0] * B, p = clamp((t - t0) / .3), e = ease3(p);
    bgA.style.background = SCENES[Math.max(i - 1, 0)][1];
    bgB.style.background = SCENES[i][1];
    bgB.style.clipPath = i === 0 ? 'none' : `circle(${(e * 900).toFixed(0)}px at 50% 46%)`;
    // 무대 — 박마다 살짝 숨 쉬고, 터지는 순간 흔들린다. 드롭 전·브레이크는 약하게
    const inten = t < 60 * B ? .35 : (t > 92.5 * B && t < 108 * B) ? .25 : 1;
    let sx = 0, sy = 0;
    for (const s of SHAKE) { const d = t - s.t; if (d >= 0 && d < .5) { const a = s.amp * Math.exp(-d * 9); sx += a * Math.sin(d * 72); sy += a * Math.cos(d * 83); } }
    const bar = Math.exp(-(((t / BAR) % 1)) * 5);
    let sc = 1 + inten * (.006 * kick(t) + .012 * bar), org = '50% 49%', op = 1;
    if (t > 57 * B && t < 60 * B) { const q = (t - 57 * B) / (3 * B); sc *= 1 + .12 * q * q; sx += Math.sin(t * 67) * 3 * q; sy += Math.cos(t * 71) * 3 * q;
      if (t > 59.6 * B) op = 1 - .55 * clamp((t - 59.6 * B) / (.4 * B)); }
    if (t > 66 * B && t < 68 * B) { const q = clamp((t - 66 * B) / (2 * B)); sc *= 1 + 9 * q * q * q; org = `${CX}px 470px`; }   // 박 68 에 정확히 빠져나온다(68.3 까지 붙잡으면 박 뒤에 튄다)
    stage.style.transformOrigin = org; stage.style.opacity = op.toFixed(3);
    stage.style.transform = `translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) scale(${sc.toFixed(4)})`;
    applyReg(t); drawFlaps(t); drawStatus(t); TICK.forEach(f => f(t));
    // 글리치
    const g = t < 57.2 * B ? glitchAt(t) : 0;
    if (g) { const s = Math.floor(t * 30), y0 = hf(s, 1) * 70, h = 14 + hf(s, 2) * 30;
      b1.style.filter = 'drop-shadow(6px 0 0 rgba(255,0,80,.85)) drop-shadow(-6px 0 0 rgba(0,229,255,.85))';
      b1.style.clipPath = hf(s, 3) > .45 ? `inset(${y0.toFixed(1)}% 0 ${Math.max(0, 100 - y0 - h).toFixed(1)}% 0)` : 'none';
      b1.style.translate = `${((hf(s, 4) - .5) * 18).toFixed(1)}px 0`; scanEl.style.opacity = .7; }
    else { b1.style.filter = ''; b1.style.clipPath = ''; b1.style.translate = ''; scanEl.style.opacity = t > 52 * B && t < 57 * B ? .25 : 0; }
    let fl = 0; FLASH.forEach(([b, a]) => { const d = t - b * B; if (d >= 0) fl += a * Math.exp(-d * 13); });
    flashEl.style.opacity = Math.min(fl, .9).toFixed(3);
    drawFX(t); drawBursts(cb, t, false); drawBursts(cf, t, true); zap(cf, t);
  };
</script>
</body></html>
