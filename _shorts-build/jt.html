<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>숏폼 J 썸네일 — 떠나기 전 필수품</title>
<link rel="stylesheet" href="shorts.css">
<style>
  /* 떠나기 전 필수품 편 썸네일(영상 장면이 아니라 따로 그린 한 장).
     다른 편 썸네일이 거의 다 짙은 남색·밤이라(앱 소개 한 편만 분홍) 이 편은 '맑은 낮 하늘'로 구별한다 — 분홍 금지(사용자 지시).
     여행 가방에 해시태그 스티커가 제멋대로 붙은 모습. 태그 문구는 shorts.json 의 j_tags('|' 로 구분) — 언어마다 그 나라 태그.
     렌더: node render.mjs jt.html --stills 0 <폴더> --lang ko → 1080×1920 PNG */
  .v { background: linear-gradient(180deg, #1d9bf0 0%, #4cc3ff 46%, #b9ecff 100%); color: #10163f; }
  .sun { position: absolute; left: 210px; top: -14px; width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, #fff7d6 0 34%, rgba(255,240,180,.55) 35%, rgba(255,240,180,0) 70%); }
  .cl { position: absolute; background: #fff; border-radius: 999px; opacity: .92; box-shadow: 0 10px 24px rgba(20,90,150,.18); }
  .cl::before, .cl::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cl::before { width: 46%; height: 150%; left: 14%; bottom: 20%; }
  .cl::after { width: 34%; height: 120%; left: 50%; bottom: 25%; }
  .trail { position: absolute; left: -36px; top: 188px; width: 360px; height: 6px; border-radius: 3px; transform: rotate(-17deg); transform-origin: 100% 50%;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.9)); }
  .plane { position: absolute; left: 300px; top: 168px; transform: rotate(73deg); }
  /* 여행 가방 */
  .case { position: absolute; left: 140px; top: 410px; width: 260px; height: 350px; border-radius: 30px;
    background: linear-gradient(90deg, #17246b 0%, #22329a 50%, #17246b 100%); box-shadow: 0 30px 50px rgba(10,40,90,.35), inset 0 -10px 0 rgba(0,0,0,.18); }
  .case i { position: absolute; top: 18px; bottom: 18px; width: 10px; border-radius: 5px; background: rgba(255,255,255,.1); }
  .hdl { position: absolute; left: 215px; top: 362px; width: 110px; height: 66px; border: 13px solid #10184d; border-bottom: 0; border-radius: 22px 22px 0 0; box-sizing: border-box; }
  .whl { position: absolute; top: 752px; width: 38px; height: 38px; border-radius: 50%; background: #10163f; box-shadow: inset 0 0 0 9px #2c3780; }
  .icon { position: absolute; left: 212px; top: 452px; width: 116px; height: 116px; border-radius: 26px; transform: rotate(7deg);
    box-shadow: 0 0 0 6px #fff, 0 12px 22px rgba(0,0,0,.28); }
  /* 스티커 — 둥근 띠, 흰 테두리, 살짝 기운 그림자 */
  .tg { position: absolute; white-space: nowrap; font-weight: 900; letter-spacing: -.5px; line-height: 1; padding: .34em .56em .38em; border-radius: .5em;
    box-shadow: 0 0 0 4px #fff, 0 10px 18px rgba(10,40,90,.3); transform-origin: 50% 50%; }
  .s1 { background: #ffd23f; color: #10163f; }
  .s2 { background: #fff; color: #10163f; box-shadow: 0 0 0 4px #10163f, 0 10px 18px rgba(10,40,90,.3); }
  .s3 { background: #10163f; color: #fff; }
  .s4 { background: #14b8a6; color: #fff; }
  .s5 { background: #ff8a1f; color: #fff; }
  .s6 { background: #5b6cff; color: #fff; }
</style></head>
<body>
<div class="v">
  <div class="sun"></div>
  <div class="cl" style="left:28px;top:118px;width:150px;height:46px"></div>
  <div class="cl" style="left:330px;top:300px;width:180px;height:52px"></div>
  <div class="cl" style="left:-30px;top:560px;width:150px;height:44px;opacity:.75"></div>
  <div class="cl" style="left:430px;top:690px;width:150px;height:44px;opacity:.75"></div>
  <div class="trail"></div>
  <div class="plane"><svg viewBox="0 0 24 24" width="40" height="40" fill="#fff"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></div>
  <div class="hdl"></div>
  <div class="case"><i style="left:58px"></i><i style="left:125px"></i><i style="left:192px"></i></div>
  <div class="whl" style="left:170px"></div><div class="whl" style="left:332px"></div>
  <img class="icon" src="img/app-icon.png" alt="">
  <div id="tags"></div>
</div>
<script src="engine.js"></script>
<script>
  window.DURATION = 1; window.SFX = [];
  // 스티커 자리 — [가운데 x, 가운데 y, 기울기(도), 글자 크기, 색]. 태그 순서대로 앞 자리부터 쓴다.
  //   첫 자리가 가장 크다(가방 한가운데). 긴 언어는 폭 MAXW 를 넘지 않게 글자를 줄인다.
  const SLOTS = [
    [270, 640, -5, 44, 's1'],   // 1 주 태그(여행 필수템) — 가방 한가운데
    [178, 196, -9, 38, 's2'],   // 2
    [362, 268, 8, 34, 's3'],    // 3
    [128, 404, -12, 32, 's4'],  // 4
    [418, 452, 10, 30, 's5'],   // 5
    [150, 806, 7, 30, 's2'],    // 6
    [380, 842, -7, 34, 's6'],   // 7
    [125, 105, 6, 26, 's4'],    // 8 위 왼쪽
    [405, 128, -6, 28, 's5'],   // 9 위 오른쪽
    [445, 572, -9, 30, 's2'],   // 10 가방 오른쪽
    [92, 548, 8, 28, 's3'],     // 11 가방 왼쪽
    [270, 908, 3, 28, 's4'],    // 12 맨 아래
    [440, 712, -7, 26, 's6'],   // 13 가방 오른쪽 아래
  ];
  const MAXW = 390;
  const tags = (L.j_tags || '').split('|').map(x => x.trim()).filter(Boolean);
  const box = document.getElementById('tags');
  const els = tags.slice(0, SLOTS.length).map((t, i) => {
    const [x, y, r, fs, cls] = SLOTS[i], d = document.createElement('div');
    d.className = 'tg ' + cls; d.textContent = t; d.dir = 'auto'; d.style.fontSize = fs + 'px'; box.appendChild(d);
    return { d, x, y, r, fs };
  });
  function place() {
    els.forEach(E => { let fs = E.fs; E.d.style.fontSize = fs + 'px';
      while (E.d.offsetWidth > MAXW && fs > 14) { fs -= 1; E.d.style.fontSize = fs + 'px'; }
      E.d.style.left = (E.x - E.d.offsetWidth / 2).toFixed(1) + 'px'; E.d.style.top = (E.y - E.d.offsetHeight / 2).toFixed(1) + 'px';
      E.d.style.transform = `rotate(${E.r}deg)`; });
  }
  place(); document.fonts.ready.then(place);
  document.documentElement.lang = L.bcp || 'ko'; if (L.dir === 'rtl') document.documentElement.dir = 'rtl';
</script>
</body></html>
