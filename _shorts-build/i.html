<div class="v">

<script>
  // ── 박 그리드 ────────────────────────────────────────────────────────
  const B = 0.48384;                                     // 1박 — Techno Fest Vibes 실측 0.48387초(124.00 BPM)
  // 영상 박 ↔ 내용 박. ① 내용 4~8 을 영상 4~10 으로 늘린다(여행 문장)
  //                    ② 내용 64.3 에서 8박 멈추고(HOLD) 그동안 연락처 입력을 영상 시각(window.INS = 멈춤 안 박)으로 그린다.
  //                       8박(2마디)이라 뒤쪽 장면의 마디 첫 박 위치가 그대로다.
  const HOLD_C = 64.3, HOLD_V = 8;
  const toVideo = c => c < 4 ? c : c < 8 ? 4 + (c - 4) * 1.5 : c < HOLD_C ? c + 2 : c + 2 + HOLD_V;
  const toContent = v => { if (v < 4) return v; if (v < 10) return 4 + (v - 4) / 1.5; const w = v - 2; return w < HOLD_C ? w : w < HOLD_C + HOLD_V ? HOLD_C : w - HOLD_V; };
  const insAt = v => { const w = v - 2; return v >= 10 && w >= HOLD_C && w < HOLD_C + HOLD_V ? w - HOLD_C : null; };
  window.INS = null;
