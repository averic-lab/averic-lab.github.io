<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>숏폼 A — 전화 안 받는 엄마</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="shorts.css">
<style>
  /* 폰 — 홈 히어로 목업(352×722)을 통째로 축소. 안쪽 px 는 건드리지 않는다 */
  .pw { position: absolute; left: 143px; top: 262px; transform: scale(.72); transform-origin: top left; }
  .layer { position: absolute; inset: 0; display: flex; flex-direction: column; background: #F7F9F8; }

  /* 통화 기록 — 특정 OS 화면을 흉내 내지 않은 일반형 */
  .calls .hd { padding: 14px 22px 10px; font-size: 26px; font-weight: 800; }
  .calls .row { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid #E8EAF0; }
  .calls .av { width: 42px; height: 42px; flex: none; border-radius: 50%; background: #E3E7F6; color: #4355B9;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
  .calls .nm2 { font-size: 16px; font-weight: 700; }
  .calls .st { font-size: 12.5px; color: #E53935; margin-top: 2px; }
  .calls .tm { margin-inline-start: auto; font-size: 13px; color: #757575; white-space: nowrap; }
  .dim { position: absolute; inset: 0; background: rgba(8,10,30,.62); }

  /* 잠금 화면 */
  .lock { background: linear-gradient(170deg, #25204f 0%, #4b3a74 55%, #7a4f78 100%); color: #fff; text-align: center; }
  .lock .d { margin-top: 280px; font-size: 16px; font-weight: 600; opacity: .9; }
  .lock .tm { font-size: 76px; font-weight: 300; letter-spacing: -2px; line-height: 1.1; }

  .fpush { left: 44px; top: 300px; width: 340px; --base: scale(1.25); transform-origin: top left; }
  .fpush .now { margin-inline-start: auto; font-size: 10.5px; color: #9AA0AE; }
  .fcard { left: 42px; top: 440px; width: 332px; --base: scale(1.3); transform-origin: top left;
    background: #EEF6EF !important; }
  .fcard .slot { height: 120px; }
</style></head>
<body><div class="v">

  <p class="cap" data-t="-1,3.2" data-fx="up"><span data-h="a1"></span><small data-k="a1s"></small></p>
  <p class="cap" data-t="3.5,6.6" data-fx="up" data-h="a2"></p>
  <p class="cap" data-t="6.9,10.8" data-fx="up" data-h="a3"></p>
  <p class="cap" data-t="11.1,15.2" data-fx="up" data-h="a4"></p>

  <div class="pw" data-t="-1,15.2"><div class="phone"><div class="screen" style="position:relative">

    <!-- ① 통화 기록 -->
    <div class="layer calls" data-t="-1,6.3">
      <div class="statusbar"><span class="t-sb1"></span><span>&#9646;&#9646;&#9646;</span></div>
      <div class="hd" data-k="calls"></div>
      <div class="row"><span class="av"></span><div><div class="nm2" data-k="mom"></div><div class="st" data-k="no_answer"></div></div><span class="tm" data-w="19:48"></span></div>
      <div class="row"><span class="av"></span><div><div class="nm2" data-k="mom"></div><div class="st" data-k="no_answer"></div></div><span class="tm" data-w="19:31"></span></div>
      <div class="row"><span class="av"></span><div><div class="nm2" data-k="mom"></div><div class="st" data-k="no_answer"></div></div><span class="tm" data-w="19:12"></span></div>
      <div class="dim" data-t="3.5"></div>
    </div>

    <!-- ② 잠금 화면 -->
    <div class="layer lock" data-t="6.1,11.0">
      <div class="d t-date"></div><div class="tm t-lock"></div>
    </div>

    <!-- ③ 보호자 대시보드 — 홈 히어로 마크업 -->
    <div class="layer" data-t="10.7">
      <div class="statusbar"><span class="t-sb2"></span><span>&#9646;&#9646;&#9646;</span></div>
      <div class="appbar" data-k="guardian_title"></div>
      <div class="pbody">
        <div class="phead" data-h="phead"></div>
        <div class="psum" data-k="psum"></div>
        <div class="plegend"><span><i></i><span data-k="legend"></span></span></div>
        <div class="plist" data-k="plist"></div>
        <div class="cards"><div class="scard" style="flex-basis:100%">
          <div class="r1"><span class="nm"><span data-k="mom"></span><span class="bat">72%</span></span><span class="pill" data-k="pill"></span></div>
          <div class="r2"><span class="act" data-k="act"></span></div>
          <div class="slot" style="height:104px"><div class="ghost">
            <div class="chd"><span data-k="steps"></span><b class="peak n-steps"></b></div>
            <div class="plot"><i></i><i></i><i></i><i></i><i></i><i></i><i class="today"></i></div>
            <div class="xlab" data-k="last7"></div></div></div>
          <div class="last" data-k="last_now"></div>
        </div></div>
        <div class="addbtn"><span class="circle">+</span><span class="t" data-k="add"></span></div>
      </div>
    </div>
  </div></div></div>

  <!-- 확대해서 띄운 조각 -->
  <div class="push float fpush" data-t="7.1,11.0" data-fx="down">
    <div class="r"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12,21 C2,15 5,5 12,8 C19,5 22,15 12,21 Z"/></svg></span><span class="app" data-k="app_name"></span><span class="now" data-k="now"></span></div>
    <div class="ti" data-k="push_title"></div>
    <div class="bo t-push"></div>
  </div>

  <div class="scard float fcard" data-t="12.0,15.2" data-fx="pop">
    <div class="r1"><span class="nm"><span data-k="mom"></span><span class="bat">72%</span></span><span class="pill" data-k="pill"></span></div>
    <div class="r2"><span class="act" data-k="act"></span></div>
    <div class="slot"><div class="ghost">
      <div class="chd"><span data-k="steps"></span><b class="peak n-steps"></b></div>
      <div class="plot"><i></i><i></i><i></i><i></i><i></i><i></i><i class="today"></i></div>
      <div class="xlab" data-k="last7"></div></div></div>
    <div class="last" data-k="last_now"></div>
  </div>

</div>
<script src="engine.js"></script>
<script>
  window.DURATION = 22.0;
  // 효과음 — t 는 화면에 그 요소가 나타나는 시각(data-t 와 같은 값). 크기·앞 무음 보정은 audio.py 가 한다.
  // 팝업·알림이 뜰 때만 넣는다. duck:true 는 앱 알림음. 엔딩 로고 차임은 모든 편 공통(시리즈 서명).
  window.SFX = [
    { t: 7.1,  file: '1_푸시알림/positive-notification.mp3', duck: true }, // 잠금 화면에 알림 도착
    { t: 12.0, file: '1_푸시알림/bubble-pop-up-alert-notification.mp3' }, // 엄마 카드
    { t: 19.2, file: '3_페이지_넘김/page-forward-single-chime.mp3' },      // 엔딩 로고(15.2 + 4.0)
  ];
  fillText();
  const $$ = s => document.querySelectorAll(s);
  $$('.av').forEach(e => { e.textContent = Array.from(L.mom)[0]; });
  $$('[data-w]').forEach(e => { const [h, m] = e.dataset.w.split(':').map(Number); e.textContent = fmtTime(wall(h, m)); });
  $$('.t-sb1').forEach(e => { e.textContent = fmtShort(wall(19, 52)); });
  $$('.t-sb2').forEach(e => { e.textContent = fmtShort(wall(20, 5)); });
  $$('.t-date').forEach(e => { e.textContent = fmtDate(wall(20, 4)); });
  $$('.t-lock').forEach(e => { e.textContent = fmtShort(wall(20, 4)); });
  const today = setWeek([5120, 5860, 5340, 6280, 5510, 5930, 6420]);   // 엄마(성인) — 평균 5,780 → 활동적
  $$('.t-push').forEach(e => { e.textContent = pushBody(L.mom, today); });
  mountEnding(15.2);
  const card = document.querySelector('.fcard');
  window.extra = t => growBars(card, t, 12.4);
</script>
</body></html>
