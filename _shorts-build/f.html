     움직임은 전부 render(ms) → extra(t): 비행기 이륙·유도등·하늘색·가로등·창문 불빛·아침빛·카메라 줌. */

  // 효과음 — t 는 화면에 그 요소가 나타나는 시각(data-t 와 같은 값). 크기·앞 무음 보정은 audio.py.
  window.SFX = [
    { t: 4.0,  file: '1_푸시알림/dry-pop-up-notification-alert.mp3' },    // 내 안전 코드
    { t: 5.2,  file: '1_푸시알림/dry-pop-up-notification-alert.mp3' },    // 엄마 폰 연결 화면
    { t: 6.8,  file: '1_푸시알림/bubble-pop-up-alert-notification.mp3' }, // 연결 완료
    { t: 13.2, file: '2_슬라이드_전환/fast-small-sweep-transition.mp3' },  // 안부가 날아온다
    { t: 14.1, file: '1_푸시알림/positive-notification.mp3', duck: true }, // 엄마 폰에 안부
    { t: 17.2, file: '1_푸시알림/bubble-pop-up-alert-notification.mp3' }, // 보호자 카드
    { t: 24.2, file: '3_페이지_넘김/page-forward-single-chime.mp3' },      // 엔딩 로고(20.2 + 4.0)
  ];
  fillText();
  const $ = s => document.querySelector(s);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

  // 아들(성인) — 출국 전 평소 5천~6천 보, 여행 나흘째부터 크게 늘었다. 평균 약 13,240 → 아주 활동적
  const today = setWeek([6120, 5470, 5890, 17360, 19840, 16520, 21480]);
  $('.t-push').textContent = pushBody(L.f_alias, today);
  // 밤사이 도착해 있던 알림 — "지금"이 아니라 "6시간 전"(언어별 표현은 Intl)
  $('.t-ago').textContent = new Intl.RelativeTimeFormat(L.bcp, { numeric: 'auto' }).format(-6, 'hour');
  mountEnding(20.2, L.f_q1, L.f_q2);

  // 활주로 유도등 — 왼쪽에서 오른쪽으로 차례로 깜박인다
  const rwl = $('.rwl'), lights = [];
  for (let i = 0; i < 16; i++) lights.push(mk('circle', { cx: 50 + i * 29, cy: 676, r: 2.6, fill: '#ffd28a' }, rwl));
  // 도시 창문 — 각자 다른 시각에 켜진다(한꺼번에 켜지면 기계적이다)
  const cw = $('.cwin'), wins = [];
  const houses = [[0, 100, 650], [100, 220, 632], [220, 320, 662], [320, 450, 622], [450, 540, 652]];
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  houses.forEach(([x0, x1, y0]) => {
    for (let y = y0 + 14; y < 780; y += 34) for (let x = x0 + 14; x < x1 - 20; x += 30) {
      if (rnd() < 0.3) continue;
      mk('rect', { x, y, width: 14, height: 18, fill: '#2a1f40' }, cw);
      wins.push([mk('rect', { x, y, width: 14, height: 18, fill: '#ffcf8a', opacity: 0 }, cw), 9.4 + rnd() * 3.0]);
    }
  });
  // 가로등 — 앞에서부터 하나둘
  const lg = $('.lamps'), lamps = [];
  [[60, 9.6], [190, 10.1], [330, 10.6], [470, 11.0]].forEach(([x, on]) => {
    mk('path', { d: `M${x} 660 V800`, stroke: '#1d1733', 'stroke-width': 5 }, lg);
    const glow = mk('circle', { cx: x, cy: 656, r: 70, fill: 'url(#cLamp)', opacity: 0 }, lg);
    const head = mk('rect', { x: x - 11, y: 648, width: 22, height: 12, rx: 4, fill: '#6b5a7a' }, lg);
    lamps.push([glow, head, on]);
  });

  const air = $('.s-air'), city = $('.s-city'), home = $('.s-home'), shade = $('.shade');
  const plane = $('.plane'), pbl = $('.pbl'), sun = $('.sun'), night = $('.night'), stars = $('.stars');
  const apt = $('.apt'), day = $('.day'), warm = $('.warm'), beam = $('.beam'), aptw = $('.aptw');
  const pglow = $('.pglow'), pscr = $('.pscr'), sig = $('.sig'), card = $('.fcard');
  const ramp = (t, a, b) => ease((t - a) / (b - a));
  const lin = (t, a, b) => Math.min(Math.max((t - a) / (b - a), 0), 1);
  const mix = (a, b, k) => '#' + [1, 3, 5].map(i => Math.round(parseInt(a.substr(i, 2), 16) * (1 - k) + parseInt(b.substr(i, 2), 16) * k).toString(16).padStart(2, '0')).join('');
  const B = [230, 352];                                   // 알림이 뜨는 자리

  window.extra = t => {
    // 장면 전환(교차 페이드)
    air.style.opacity = (1 - ramp(t, 8.6, 9.0)).toFixed(3);
    city.style.opacity = (ramp(t, 8.6, 9.0) - ramp(t, 12.4, 12.8)).toFixed(3);
    home.style.opacity = ramp(t, 12.4, 12.8).toFixed(3);
    // 코드 장면과 카드 장면에서 배경을 어둡게
    shade.style.opacity = (0.6 * ramp(t, 3.8, 4.2) - 0.6 * ramp(t, 8.4, 8.8) + 0.55 * ramp(t, 16.9, 17.3)).toFixed(3);

    // ① 공항: 캐리어 쪽으로 천천히 줌인, 비행기 이륙, 유도등 차례로 깜박임
    air.style.transform = `scale(${(1 + 0.08 * ramp(t, 0, 8.6)).toFixed(4)})`;
    const q = lin(t, 0.3, 3.6), p = q * q;               // 활주로에서 점점 빨라지며 떠오른다
    const px = 470 - 430 * q, py = 648 - 330 * p, s = 1 - 0.45 * q;
    plane.setAttribute('transform', `translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${(16 * Math.min(q * 2, 1)).toFixed(2)}) scale(${(-s).toFixed(3)} ${s.toFixed(3)})`);  // 그림은 기수가 +x — 좌우를 뒤집어 진행 방향(왼쪽)을 보게 한다
    plane.style.opacity = (1 - ramp(t, 3.4, 3.9)).toFixed(3);
    pbl.setAttribute('opacity', (Math.floor(t * 2.5) % 2 ? 1 : 0.25));
    lights.forEach((c, i) => {
      const ph = ((t * 1.6 - i * 0.09) % 1 + 1) % 1;
      c.setAttribute('opacity', (0.25 + 0.75 * Math.max(0, 1 - ph * 4)).toFixed(3));
    });

    // ② 도시: 해가 지고 하늘이 남색으로, 가로등·창문이 하나둘
    sun.setAttribute('transform', `translate(0 ${(40 * lin(t, 8.6, 12.6)).toFixed(1)})`);
    sun.setAttribute('opacity', (1 - 0.8 * lin(t, 8.6, 12.6)).toFixed(3));
    night.setAttribute('opacity', (0.62 * lin(t, 8.8, 12.6)).toFixed(3));
    stars.setAttribute('opacity', (0.7 * ramp(t, 10.6, 12.2)).toFixed(3));
    lamps.forEach(([glow, head, on]) => {
      const k = ramp(t, on, on + 0.35);
      glow.setAttribute('opacity', k.toFixed(3));
      head.setAttribute('fill', k > 0.5 ? '#ffe4b8' : '#6b5a7a');
    });
    wins.forEach(([w, on]) => w.setAttribute('opacity', (0.85 * ramp(t, on, on + 0.3)).toFixed(3)));

    // ③ 집: 창밖이 밝아지고 아침빛이 번진다, 협탁 쪽으로 줌인
    home.style.transform = `scale(${(1 + 0.08 * ramp(t, 12.4, 20.2)).toFixed(4)})`;
    day.setAttribute('opacity', ramp(t, 12.6, 15.6).toFixed(3));
    warm.setAttribute('opacity', ramp(t, 13.2, 16.2).toFixed(3));
    beam.setAttribute('opacity', (0.9 * ramp(t, 13.4, 16.4)).toFixed(3));
    apt.setAttribute('fill', mix('#141a44', '#7c86b4', ramp(t, 12.6, 15.6)));
    aptw.setAttribute('opacity', (0.8 * (1 - ramp(t, 12.8, 14.6))).toFixed(3));
    // 폰: 안부가 닿는 순간 화면이 켜진다
    const lit = ramp(t, 14.0, 14.3);
    pglow.setAttribute('opacity', lit.toFixed(3));
    pscr.setAttribute('fill', lit > 0.5 ? '#dbe8ff' : '#1b1f3d');
    // 신호: 창밖(먼 곳)에서 알림 자리로
    const A = [150, 380];
    const g = lin(t, 13.2, 14.1), gp = g * g * (3 - 2 * g);
    sig.style.left = (A[0] + (B[0] - A[0]) * gp) + 'px';
    sig.style.top = (A[1] + (B[1] - A[1]) * gp - Math.sin(gp * Math.PI) * 60) + 'px';
    growBars(card, t, 17.5);
  };
</script>
</body></html>
