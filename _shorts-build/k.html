<!-- 손 그림 톤: 크림색 종이 위에 삐뚤한 크레용 선이 천천히 그려진다. 같은 소재(a.html 전화 안 받는 엄마)의 뒷이야기.
     모든 움직임은 시간 t 의 함수(window.extra) — 벽시계·CSS animation·Math.random 을 쓰지 않는다.
     선의 '떨림(boil)'은 흔들림 필터의 seed 를 1/8초마다 바꿔 손으로 다시 그린 것처럼 보이게 한다.
     걸음수는 폰이 세는 값이라 엄마는 폰을 주머니에 넣고 다닌다(폰을 두고 나가면 걸음수가 쌓이지 않아 앞뒤가 안 맞는다). -->

<p class="hk-cap" data-t="17.9,22.4" data-fx="up" data-h="k5"></p>
<p class="hk-cap" data-t="22.8,27.3" data-fx="up" data-h="k6"></p>

<div class="hk-push" data-t="17.8,23.0" data-fx="down">
  <div class="r"><img src="img/app-icon.png" alt=""><span data-k="app_name"></span><span class="nw" data-k="now"></span></div>
  <div class="ti" data-k="push_title"></div>
  <div class="bo" id="pbody"></div>
</div>

</div>
<script src="engine.js"></script>
<script>
  const END = 27.6;
  window.DURATION = END + 6.8;                 // 공통 엔딩 6.8초(문장 2줄 → 로고 +4.0초)
  // 효과음 — 알림이 뜰 때만(README 「소리」). 엔딩 로고 차임은 모든 편 공통.
  window.SFX = [
    { t: 17.8, file: '1_푸시알림/positive-notification.mp3', duck: true },
    { t: END + 4.0, file: '3_페이지_넘김/page-forward-single-chime.mp3' },
  ];
  fillText();
  const STEPS = 1482;                          // 고령자 1천 보대(README — 딱 1,000 은 피한다)
  document.getElementById('pbody').textContent = pushBody(L.mom, STEPS);
  mountEnding(END, L.k_q1, L.k_q2);
  // 엔딩 로고는 실제 앱 아이콘(README — 하트 도형을 앱 아이콘으로 쓰지 않는다)
  document.querySelector('.end .brand svg').outerHTML = '<img src="img/app-icon.png" width="72" height="72" style="display:block;margin:0 auto 12px;border-radius:16px" alt="">';

  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  const cl = (x, a = 0, b = 1) => Math.min(Math.max(x, a), b);
  const lin = (t, a, d) => cl((t - a) / d);
  const ez = p => 1 - Math.pow(1 - cl(p), 3);
  let seed = 9; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };

  // 장면 창: [등장, 퇴장] — 0.45초 교차
  const SCN = { s1: [-1, 4.6], s2: [4.4, 9.9], s3: [9.7, 13.9], s4: [13.6, 23.0], s6: [22.8, END + 0.2] };
  const vis = (t, [a, b]) => Math.min(ez((t - a) / 0.45), 1 - ez((t - b) / 0.45));

  // 선이 그려지는 효과 — 장면마다 class="dr" 경로를 차례로(순서대로 0.32초 간격, 하나 0.8초)
  const drawSets = {};
  for (const id of Object.keys(SCN)) drawSets[id] = Array.from($(id).querySelectorAll('.dr'));
  const drawStart = { s1: 0.15, s2: 4.6, s3: 9.8, s4: 13.7, s6: 22.9 };
  function drawScene(id, t) {
    drawSets[id].forEach((p, i) => {
      const k = p.id === 'link' ? lin(t, 23.6, 2.8) : p.id === 'tick' ? ez(lin(t, 26.4, 0.5)) : ez(lin(t, drawStart[id] + i * 0.32, 0.8));
      p.style.strokeDasharray = '1 1';
      p.style.strokeDashoffset = 1 - k;
      // 채움은 선이 거의 다 그려진 뒤 크레용처럼 번진다
      if (p.classList.contains('fl')) p.style.fillOpacity = ez(lin(t, drawStart[id] + i * 0.32 + 0.55, 0.5));
    });
    $(id).querySelectorAll('.fl:not(.dr)').forEach(e => { e.style.fillOpacity = ez(lin(t, drawStart[id] + 0.9, 0.6)); e.style.strokeOpacity = ez(lin(t, drawStart[id] + 0.9, 0.6)); });
  }

  // ② 발자국 — 경로를 따라 좌우 번갈아
  const trail = $('trail'), TL = trail.getTotalLength(), FEET = [];
  for (let i = 0; i < 16; i++) {
    const s = (i + 0.5) / 16 * TL, p = trail.getPointAtLength(s), q = trail.getPointAtLength(Math.min(s + 2, TL));
    const ang = Math.atan2(q.y - p.y, q.x - p.x), side = i % 2 ? 1 : -1;
    const x = p.x + Math.cos(ang + Math.PI / 2) * 7 * side, y = p.y + Math.sin(ang + Math.PI / 2) * 7 * side;
    FEET.push(mk('ellipse', { cx: x.toFixed(1), cy: y.toFixed(1), rx: 4.6, ry: 7.2, transform: `rotate(${(ang * 180 / Math.PI + 90).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})` }, $('feet')));
  }
  const link = $('link'), LL = link.getTotalLength(), FEET6 = [];
  for (let i = 0; i < 12; i++) {
    const s = (i + 0.6) / 12.5 * LL, p = link.getPointAtLength(s), q = link.getPointAtLength(Math.min(s + 2, LL));
    const ang = Math.atan2(q.y - p.y, q.x - p.x), side = i % 2 ? 1 : -1;
    const x = p.x + Math.cos(ang + Math.PI / 2) * 11 * side, y = p.y + Math.sin(ang + Math.PI / 2) * 11 * side;
    FEET6.push(mk('ellipse', { cx: x.toFixed(1), cy: y.toFixed(1), rx: 3.6, ry: 5.8, transform: `rotate(${(ang * 180 / Math.PI + 90).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})` }, $('feet6')));
  }

  // ③ 소음 낙서(지그재그·음표) — 고정 난수
  seed = 21; const NOISE = [];
  for (let i = 0; i < 14; i++) {
    const cx = 100 + rnd() * 330, cy = 330 + rnd() * 330;
    if (Math.abs(cx - 270) < 110 && cy > 380 && cy < 630) { i--; continue; }   // 주머니 위는 비운다
    let d = `M${cx.toFixed(0)} ${cy.toFixed(0)}`;
    if (i % 3 === 2) d += ' m-6 0 a6 5 0 1 0 12 0 a6 5 0 1 0 -12 0 m12 0 v-26 l14 6';   // 음표
    else for (let k = 0; k < 4; k++) d += ` l${(9 + rnd() * 6).toFixed(0)} ${(k % 2 ? 10 : -10)}`;
    NOISE.push(mk('path', { d, pathLength: 1, 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1 }, $('noise')));
  }
  const RINGS = [0, 1, 2].map(() => mk('path', { d: '' }, $('rings')));

  // ④ 걱정 낙서 — 폰 둘레를 엉키며 도는 고리들
  seed = 77; const SCRIB = [];
  for (let n = 0; n < 8; n++) {
    const cx = 270 + (rnd() - 0.5) * 70, cy = 510 + (rnd() - 0.5) * 90, sx = 0.76 + rnd() * 0.14;
    let a = rnd() * 6.28; const pts = [];
    for (let k = 0; k < 18; k++) { a += 0.55 + rnd() * 0.3; const r = 105 + rnd() * 55; pts.push([cx + Math.cos(a) * r * sx, cy + Math.sin(a) * r]); }
    let d = `M${pts[0][0].toFixed(0)} ${pts[0][1].toFixed(0)}`;
    for (let k = 1; k < pts.length - 1; k++) { const m = [(pts[k][0] + pts[k + 1][0]) / 2, (pts[k][1] + pts[k + 1][1]) / 2]; d += ` Q${pts[k][0].toFixed(0)} ${pts[k][1].toFixed(0)} ${m[0].toFixed(0)} ${m[1].toFixed(0)}`; }
    SCRIB.push(mk('path', { d, pathLength: 1, 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1 }, $('scrib')));
  }

  window.extra = t => {
    $('wobT').setAttribute('seed', 1 + (Math.floor(t * 8) % 6));      // 손 그림 떨림(boil)
    for (const id in SCN) { const o = vis(t, SCN[id]); $(id).style.opacity = o.toFixed(3); if (o > 0) drawScene(id, t); }

    // ① 해가 떠오르고 김이 오른다
    $('sun').setAttribute('transform', `translate(0 ${(-58 * ez(lin(t, 0.4, 3.0))).toFixed(1)})`);
    ['steam1', 'steam2'].forEach((s, i) => { const k = (t * 0.9 + i * 0.5) % 1; $(s).setAttribute('transform', `translate(0 ${(-k * 14).toFixed(1)})`); $(s).style.opacity = (Math.sin(k * Math.PI) * ez(lin(t, 1.6, 0.6))).toFixed(2); });

    // ② 발자국 한 걸음씩 + 걸음수
    const fk = lin(t, 5.0, 3.6);
    FEET.forEach((f, i) => { f.style.opacity = ez((fk * FEET.length - i) / 1.2).toFixed(2); });
    $('cntN').textContent = fmtNum(Math.round(STEPS * ez(fk)));

    // ③ 전화기 떨림·벨 파동 — 소음 낙서가 커질수록 파동이 묻힌다
    const nk = lin(t, 10.3, 2.4);
    NOISE.forEach((p, i) => { p.style.strokeDashoffset = 1 - ez((nk * NOISE.length - i * 0.6) / 2); });
    const shake = t > 9.9 && t < 13.6 ? Math.sin(t * 2 * Math.PI * 9) * 3.4 : 0;
    $('pphone').setAttribute('transform', `rotate(${shake.toFixed(2)} 270 470) translate(0 ${(-30 * ez(lin(t, 9.9, 0.6))).toFixed(1)})`);
    RINGS.forEach((r, i) => {
      const ph = ((t - 10.0) / 0.9 + i / 3) % 1, rr = 30 + ph * 70;
      r.setAttribute('d', `M${(270 - rr).toFixed(0)} ${(380 - rr * 0.35).toFixed(0)} A${rr.toFixed(0)} ${rr.toFixed(0)} 0 0 1 ${(270 + rr).toFixed(0)} ${(380 - rr * 0.35).toFixed(0)}`);
      r.style.opacity = t < 10.0 ? 0 : ((1 - ph) * (1 - 0.75 * nk)).toFixed(2);
    });

    // ④ 엉키는 걱정 낙서 → ⑤ 알림이 오면 한 줄씩 풀려 사라진다
    SCRIB.forEach((p, i) => {
      const grow = ez(lin(t, 14.2 + i * 0.42, 1.4)), undo = ez(lin(t, 18.4 + (SCRIB.length - 1 - i) * 0.22, 0.9));
      p.style.strokeDashoffset = (1 - grow * (1 - undo)).toFixed(3);
    });
    $('glowg').style.opacity = ez(lin(t, 18.2, 1.6)).toFixed(2);
    $('miss').style.opacity = (ez(lin(t, 14.4, 0.5)) * (1 - ez(lin(t, 17.8, 0.5)))).toFixed(2);

    // ⑥ 발자국 선이 딸의 폰까지 이어지고 체크
    const lk = lin(t, 23.6, 2.8);
    FEET6.forEach((f, i) => { f.style.opacity = ez((lk * FEET6.length - i) / 1.2).toFixed(2); });
  };
</script>
