<!doctype html>
<html lang="{{HTML_LANG}}"{{DIR_ATTR}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{shorts_title}} · {{brand}}</title>
<meta name="description" content="{{shorts_lead}}">
<meta name="theme-color" content="#0a0e2a">

{{SHORTS_HEAD_LINKS}}

<meta property="og:type" content="website">
<meta property="og:title" content="{{shorts_title}} · {{brand}}">
<meta property="og:description" content="{{shorts_lead}}">
<meta property="og:url" content="https://averic.co.kr{{PATH}}shorts.html">
<meta property="og:image" content="https://averic.co.kr/og-image.png">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff8a95'/%3E%3Cstop offset='1' stop-color='%23e54b5e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M50,86 C-10,52 12,8 50,32 C88,8 110,52 50,86 Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css?v={{ASSET_VER}}">
</head>
<body>

<!-- 머리글·꼬리글은 i18n/build.py 가 template.html 에서 그대로 잘라 넣는다(두 벌로 두지 않는다) -->
{{HEADER}}

<main class="shorts-page">
  <div class="shorts-head">
    <h1>{{shorts_title}}</h1>
    <p>{{shorts_lead}}</p>
  </div>
{{SHORTS_GRID}}
  <p class="shorts-back"><a href="{{PATH}}">{{shorts_back}}</a></p>
</main>

{{FOOTER}}

<script src="/site.js?v={{ASSET_VER}}"></script>
</body>
</html>
